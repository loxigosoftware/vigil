<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="vigil">
  <defs>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14" result="b"/>
    </filter>
  </defs>

  <!-- app-icon background -->
  <rect width="512" height="512" rx="112" fill="#08130A"/>

  <!-- camera viewfinder corner brackets -->
  <g stroke="#00FF41" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.32">
    <path d="M 38 74 V 38 H 74"/>
    <path d="M 438 38 H 474 V 74"/>
    <path d="M 38 438 V 474 H 74"/>
    <path d="M 474 438 V 474 H 438"/>
  </g>

  <!-- monitoring rings behind the owl -->
  <circle cx="256" cy="288" r="186" stroke="#00FF41" stroke-width="2" fill="none" opacity="0.10"/>
  <circle cx="256" cy="288" r="150" stroke="#00FF41" stroke-width="2" fill="none" opacity="0.07"/>

  <!-- owl body -->
  <ellipse cx="256" cy="344" rx="112" ry="116" fill="#0C2410" stroke="#00FF41" stroke-width="3" opacity="0.55"/>

  <!-- ear tufts -->
  <path d="M 172 152 L 204 90 L 244 146 Z" fill="#0C2410" stroke="#00FF41" stroke-width="3" stroke-linejoin="round" opacity="0.55"/>
  <path d="M 268 146 L 308 90 L 340 152 Z" fill="#0C2410" stroke="#00FF41" stroke-width="3" stroke-linejoin="round" opacity="0.55"/>

  <!-- head -->
  <circle cx="256" cy="224" r="96" fill="#0C2410" stroke="#00FF41" stroke-width="3" opacity="0.55"/>

  <!-- eyes (night-vision glow) -->
  <circle cx="200" cy="212" r="46" fill="#00FF41" filter="url(#glow)" opacity="0.45"/>
  <circle cx="312" cy="212" r="46" fill="#00FF41" filter="url(#glow)" opacity="0.45"/>
  <circle cx="200" cy="212" r="40" fill="#00FF41"/>
  <circle cx="312" cy="212" r="40" fill="#00FF41"/>
  <circle cx="200" cy="212" r="16" fill="#06260B"/>
  <circle cx="312" cy="212" r="16" fill="#06260B"/>
  <circle cx="192" cy="203" r="4.5" fill="#B8FFCB"/>
  <circle cx="304" cy="203" r="4.5" fill="#B8FFCB"/>

  <!-- beak -->
  <path d="M 238 270 L 256 296 L 274 270 Z" fill="#00FF41" stroke="#00FF41" stroke-width="6" stroke-linejoin="round"/>

  <!-- chest V (vigil) -->
  <path d="M 228 344 L 256 380 L 284 344" stroke="#00FF41" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.95"/>
</svg>
