# vigil: home camera patrol agent (built on amele).
# Run:     bin/amele run agent.yaml "Patrol all cameras and send the report"
# Env:     PROVIDER_TYPE, BASE_URL, API_KEY, AMELE_MODEL,
#          TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID, RTSP_USER, RTSP_PASS

model: ${AMELE_MODEL}

provider:
  # Wire protocol — the single switch shared with camera_status.py:
  #   openai (default) — any OpenAI-compatible endpoint:
  #       local Ollama  -> BASE_URL=http://localhost:11434/v1, API_KEY empty
  #       OpenAI        -> BASE_URL=https://api.openai.com/v1
  #       OpenRouter    -> BASE_URL=https://openrouter.ai/api/v1
  #   anthropic — native Anthropic Messages API:
  #       BASE_URL=https://api.anthropic.com (must NOT end with /v1)
  type: ${PROVIDER_TYPE}
  base_url: ${BASE_URL}
  api_key: ${API_KEY}   # env reference only — amele rejects literal keys in YAML

system_prompt: |
  You are a home camera patrol agent. Your job: check every camera one by one
  and send the owner a short, clear report via Telegram.

  Steps:
  1. Read cameras.json with fs_read (repo root, JSON list).
  2. For EVERY camera in the list, call the camera_status tool and write the
     camera's exact name to stdin. The tool returns an analysis of that
     camera's live view (person/animal/motion/anomaly).
  3. Keep a one-line status note for each camera.
  4. When all cameras are done, send ONE report with send_telegram:
     heading line "📍 Patrol Report", then one "Camera name: status" line per
     camera. If a person or anomaly is seen, prefix the heading with "⚠️" and
     attach that camera's snapshot with send_telegram_photo. If everything is
     normal, prefix the heading with "✅".

  Rules:
  - Keep the report short: at most one line per camera, a few lines total.
  - Use camera names exactly as they appear in cameras.json.
  - If a person is visible, always say so; if unsure, say "unclear".
  - If a camera cannot connect, report it as "unreachable", do not skip it.
  - Take tool output as-is; never invent results.

workspace: .          # fs tools can only read this folder

tools:
  fs: true
  subprocess:
    - name: camera_status
      description: >
        Captures a camera's live view, analyzes it with the local vision
        model, and returns a short description of what is visible. Input
        (stdin): the camera name from cameras.json. Output (stdout):
        analysis text or an error message.
      command: ["./tools/camera_status.py"]
      timeout: 120s
    - name: send_telegram
      description: >
        Sends a text message to the owner via Telegram. Input (stdin): the
        text to send. Output (stdout): "ok" or an error.
      command: ["./tools/telegram_send.py"]
      timeout: 30s
    - name: send_telegram_photo
      description: >
        Sends a photo to the owner via Telegram (the last captured frame).
        Input (stdin): the photo caption. Output: "ok" or an error.
      command: ["./tools/telegram_photo.py"]
      timeout: 30s

limits:
  max_turns: 40
  max_tokens: 100000
  timeout: 10m

session_dir: ./sessions
lock: true
